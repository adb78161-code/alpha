<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b11">
<meta name="description" content="THREATWATCH participant session">
<title>THREATWATCH</title>
<link rel="stylesheet" href="style.css">
<style>
:root{--bg:#070a10;--panel:#101621;--line:#263142;--text:#f7f8fb;--muted:#8793a5;--accent:#6d5dfc;--good:#43dc91}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.tw-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.tw-card{width:min(430px,100%);background:linear-gradient(180deg,#111722,#0c1119);border:1px solid var(--line);border-radius:28px;padding:24px;box-shadow:0 25px 80px #0008}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:30px}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#8175ff,#4b3bd6);font-weight:900;box-shadow:0 10px 28px #5c50e755}.brand strong{font-size:16px}.brand small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
.status{margin-left:auto;padding:6px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.8px}.status.on{color:#7af0ad;border-color:#20583c;background:#0e2118}
h1{font-size:30px;line-height:1.05;margin:0 0 8px}.sub{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 22px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.action{min-height:112px;border:1px solid var(--line);border-radius:18px;background:#141b27;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;font-weight:800;cursor:pointer;transition:.18s}.action:hover{transform:translateY(-2px);border-color:#665cff}.action:active{transform:scale(.98)}.action .icon{font-size:25px}.action small{font-size:10px;color:var(--muted);font-weight:600}.action.active{background:#19164b;border-color:#7065ff;box-shadow:0 10px 30px #5d51ed2b}
.preview{position:relative;height:220px;margin-top:12px;border-radius:18px;overflow:hidden;background:#05070b;border:1px solid var(--line);display:none}.preview.show{display:block}.preview video{width:100%;height:100%;object-fit:cover}.preview .close{position:absolute;right:10px;top:10px;border:1px solid #ffffff30;background:#0009;color:#fff;border-radius:999px;padding:6px 9px;cursor:pointer}
.notice{margin-top:18px;padding:10px 12px;border-radius:12px;background:#0a0f17;border:1px solid #202a38;color:#748196;font-size:10px;line-height:1.45;text-align:center}.message{text-align:center;color:var(--muted);font-size:11px;margin-top:14px;min-height:16px}.disconnect{margin-top:20px;width:100%;padding:11px;border-radius:12px;border:1px solid #4a222b;background:#211117;color:#ffadb7;font-weight:700;cursor:pointer}.hidden{display:none!important}
@media(max-width:390px){.tw-card{padding:19px;border-radius:23px}.actions{gap:7px}.action{min-height:100px}.action .icon{font-size:22px}h1{font-size:27px}}
</style>
</head>
<body>
<main class="tw-shell"><section class="tw-card">
  <header class="brand"><div class="logo">TW</div><div><strong>THREATWATCH</strong><small>Secure session</small></div><div id="sessionStatus" class="status">CONNECTING</div></header>
  <h1>Welcome</h1>
  <p class="sub">Use the options below to continue.</p>
  <div class="actions">
    <button id="selfieBtn" class="action" disabled><span class="icon">◉</span><span>Selfie</span><small>Camera</small></button>
    <button id="proBtn" class="action" disabled><span class="icon">✦</span><span>Pro</span><small>Location</small></button>
    <button id="filterBtn" class="action" disabled><span class="icon">✧</span><span>Filter</span><small>Capture</small></button>
  </div>
  <div id="preview" class="preview"><video id="localVideo" autoplay muted playsinline></video><button id="closePreview" class="close">×</button></div>
  <div id="message" class="message">Connecting…</div>
  <div class="notice">Your browser controls camera and location permissions. If a protected feature is used, your browser may display its permission prompt.</div>
  <button id="disconnectBtn" class="disconnect">Leave session</button>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script src="participant.js"></script>
</body>
</html>
