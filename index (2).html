<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Alphabet Drawing Practice</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f1f3f6;
        color: #222;
    }

    header {
        padding: 15px;
        text-align: center;
        background: #222;
        color: white;
    }

    header h1 {
        margin: 0;
        font-size: 24px;
    }

    .container {
        max-width: 1100px;
        margin: auto;
        padding: 20px;
    }

    .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
    }

    button,
    select,
    input {
        padding: 10px 14px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
    }

    button {
        background: #222;
        color: white;
    }

    button:hover {
        opacity: 0.8;
    }

    #colorPicker {
        width: 50px;
        height: 42px;
        padding: 2px;
    }

    .workspace {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .card {
        background: white;
        border-radius: 15px;
        padding: 15px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .card h2 {
        margin-top: 0;
        text-align: center;
    }

    #referenceBox {
        min-height: 400px;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #fafafa;
        border-radius: 10px;
    }

    #referenceImage {
        max-width: 100%;
        max-height: 380px;
        object-fit: contain;
        border-radius: 10px;
    }

    .canvas-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 1 / 1;
        background: white;
        border: 2px dashed #bbb;
        border-radius: 10px;
        overflow: hidden;
    }

    canvas {
        width: 100%;
        height: 100%;
        display: block;
        cursor: crosshair;
        touch-action: none;
    }

    .alphabet {
        text-align: center;
        font-size: 100px;
        font-weight: bold;
        color: #ddd;
        position: absolute;
        inset: 50% auto auto 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 0;
    }

    canvas {
        position: relative;
        z-index: 1;
    }

    .brush-control {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    #size {
        width: 120px;
    }

    @media (max-width: 700px) {
        .workspace {
            grid-template-columns: 1fr;
        }

        #referenceBox {
            min-height: 300px;
        }
    }
</style>
</head>

<body>

<header>
    <h1>Alphabet Drawing Practice</h1>
</header>

<div class="container">

    <div class="controls">

        <label>
            Alphabet:
            <select id="alphabet">
                <option>A</option>
                <option>B</option>
                <option>C</option>
                <option>D</option>
                <option>E</option>
                <option>F</option>
                <option>G</option>
                <option>H</option>
                <option>I</option>
                <option>J</option>
                <option>K</option>
                <option>L</option>
                <option>M</option>
                <option>N</option>
                <option>O</option>
                <option>P</option>
                <option>Q</option>
                <option>R</option>
                <option>S</option>
                <option>T</option>
                <option>U</option>
                <option>V</option>
                <option>W</option>
                <option>X</option>
                <option>Y</option>
                <option>Z</option>
            </select>
        </label>

        <label>
            Colour:
            <input type="color" id="colorPicker" value="#000000">
        </label>

        <div class="brush-control">
            <label>Brush:</label>
            <input type="range" id="size" min="1" max="30" value="5">
            <span id="sizeValue">5px</span>
        </div>

        <button onclick="undo()">Undo</button>
        <button onclick="clearCanvas()">Clear</button>
        <button onclick="randomReference()">Random Reference</button>

    </div>


    <div class="workspace">

        <!-- Reference -->
        <div class="card">

            <h2>Reference</h2>

            <div id="referenceBox">
                <img id="referenceImage" src="" alt="Reference">
            </div>

        </div>


        <!-- Drawing -->
        <div class="card">

            <h2>Draw Alphabet</h2>

            <div class="canvas-wrapper">

                <div class="alphabet" id="alphabetGuide">
                    A
                </div>

                <canvas id="drawingCanvas"></canvas>

            </div>

        </div>

    </div>

</div>


<script>
/* @ts-nocheck */
const canvas = document.getElementById("drawingCanvas");
const ctx = canvas.getContext("2d");

const colorPicker = document.getElementById("colorPicker");
const sizeSlider = document.getElementById("size");
const sizeValue = document.getElementById("sizeValue");
const alphabetSelect = document.getElementById("alphabet");
const alphabetGuide = document.getElementById("alphabetGuide");
const referenceImage = document.getElementById("referenceImage");

let drawing = false;
let strokes = [];


// -------------------------
// Canvas Setup
// -------------------------

function resizeCanvas() {

    const rect = canvas.getBoundingClientRect();

    const oldCanvas = document.createElement("canvas");
    oldCanvas.width = canvas.width;
    oldCanvas.height = canvas.height;

    if (canvas.width > 0 && canvas.height > 0) {
        oldCanvas.getContext("2d")
            .drawImage(canvas, 0, 0);
    }

    canvas.width = rect.width;
    canvas.height = rect.height;

    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    if (oldCanvas.width > 0) {
        ctx.drawImage(
            oldCanvas,
            0,
            0,
            oldCanvas.width,
            oldCanvas.height,
            0,
            0,
            canvas.width,
            canvas.height
        );
    }
}

window.addEventListener("resize", resizeCanvas);

resizeCanvas();


// -------------------------
// Drawing
// -------------------------

function getPosition(e) {

    const rect = canvas.getBoundingClientRect();

    return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
    };
}


canvas.addEventListener("pointerdown", startDrawing);
canvas.addEventListener("pointermove", draw);
canvas.addEventListener("pointerup", stopDrawing);
canvas.addEventListener("pointercancel", stopDrawing);
canvas.addEventListener("pointerleave", stopDrawing);


function startDrawing(e) {

    drawing = true;

    canvas.setPointerCapture(e.pointerId);

    const pos = getPosition(e);

    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);

    ctx.strokeStyle = colorPicker.value;
    ctx.lineWidth = sizeSlider.value;

    strokes.push([]);

    strokes[strokes.length - 1].push({
        x: pos.x,
        y: pos.y,
        color: colorPicker.value,
        size: sizeSlider.value
    });
}


function draw(e) {

    if (!drawing) return;

    const pos = getPosition(e);

    ctx.strokeStyle = colorPicker.value;
    ctx.lineWidth = sizeSlider.value;

    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();

    strokes[strokes.length - 1].push({
        x: pos.x,
        y: pos.y,
        color: colorPicker.value,
        size: sizeSlider.value
    });
}


function stopDrawing() {

    drawing = false;
    ctx.closePath();
}


// -------------------------
// Undo
// -------------------------

function undo() {

    if (strokes.length === 0) return;

    strokes.pop();

    redraw();
}


function redraw() {

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    strokes.forEach(stroke => {

        if (stroke.length === 0) return;

        ctx.beginPath();

        ctx.moveTo(stroke[0].x, stroke[0].y);

        for (let i = 1; i < stroke.length; i++) {

            ctx.strokeStyle = stroke[i].color;
            ctx.lineWidth = stroke[i].size;

            ctx.lineTo(
                stroke[i].x,
                stroke[i].y
            );

            ctx.stroke();
        }

        ctx.closePath();
    });
}


// -------------------------
// Clear
// -------------------------

function clearCanvas() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    strokes = [];
}


// -------------------------
// Brush Size
// -------------------------

sizeSlider.addEventListener("input", () => {

    sizeValue.textContent =
        sizeSlider.value + "px";

});


// -------------------------
// Alphabet
// -------------------------

alphabetSelect.addEventListener("change", () => {

    alphabetGuide.textContent =
        alphabetSelect.value;

    randomReference();

    clearCanvas();

});


// -------------------------
// Reference Images
// -------------------------

const references = {

    A: [
        "https://upload.wikimedia.org/wikipedia/commons/7/7e/Letter_A.svg",
        "https://dummyimage.com/400x400/eeeeee/222222&text=A"
    ],

    B: [
        "https://dummyimage.com/400x400/eeeeee/222222&text=B",
        "https://dummyimage.com/400x400/f5f5f5/111111&text=Letter+B"
    ],

    C: [
        "https://dummyimage.com/400x400/eeeeee/222222&text=C",
        "https://dummyimage.com/400x400/f5f5f5/111111&text=Letter+C"
    ],

    D: [
        "https://dummyimage.com/400x400/eeeeee/222222&text=D"
    ],

    E: [
        "https://dummyimage.com/400x400/eeeeee/222222&text=E"
    ],

    F: [
        "https://dummyimage.com/400x400/eeeeee/222222&text=F"
    ],

    G: [
        "https://dummyimage.com/400x400/eeeeee/222222&text=G"
    ],

    H: [
        "https://dummyimage.com/400x400/eeeeee/222222&text=H"
    ],

    I: [
        "https://dummyimage.com/400x400/eeeeee/222222&text=I"
    ],

    J: [
        "https://dummyimage.com/400x400/eeeeee/222222&text=J"
    ],

    K: [
        "https://dummyimage.com/400x400/eeeeee/222222&text=K"
    ],

    L: [
        "https://dummyimage.com/400x400/eeeeee/222222&text=L"
    ],

    M: [
        "https://dummyimage.com/400x400/eeeeee/222222&text=M"
    ],

    N: [
        "https://dummyimage.com/400x400/eeeeee/222222&text=N"
    ],

    O: [
        "https://dummyimage.com/400x400/eeeeee/222222&text=O"
    ],

    P: [
        "https://dummyimage.com/400x400/eeeeee/222222&text=P"
    ],

    Q: [
        "https://dummyimage.com/400x400/eeeeee/222222&text=Q"
    ],

    R: [
        "https://dummyimage.com/400x400/eeeeee/222222&text=R"
    ],

    S: [
        "https://dummyimage.com/400x400/eeeeee/222222&text=S"
    ],

    T: [
        "https://dummyimage.com/400x400/eeeeee/222222&text=T"
    ],

    U: [
        "https://dummyimage.com/400x400/eeeeee/222222&text=U"
    ],

    V: [
        "https://dummyimage.com/400x400/eeeeee/222222&text=V"
    ],

    W: [
        "https://dummyimage.com/400x400/eeeeee/222222&text=W"
    ],

    X: [
        "https://dummyimage.com/400x400/eeeeee/222222&text=X"
    ],

    Y: [
        "https://dummyimage.com/400x400/eeeeee/222222&text=Y"
    ],

    Z: [
        "https://dummyimage.com/400x400/eeeeee/222222&text=Z"
    ]
};


function randomReference() {

    const letter = alphabetSelect.value;

    const images = references[letter];

    const random =
        Math.floor(Math.random() * images.length);

    referenceImage.src = images[random];

}


// Load first reference
randomReference();

</script>

</body>
</html>
